<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PantryPilot — Cook what's about to expire</title>
  <meta name="description" content="A private, offline-first kitchen companion. Track your pantry, get recipes ranked by what you already have, and waste less of the food and money you buy.">
  <meta name="theme-color" content="#100e09">
  <meta name="color-scheme" content="dark">
  <meta property="og:type" content="website">
  <meta property="og:title" content="PantryPilot — Cook what's about to expire">
  <meta property="og:description" content="Track your pantry, get recipes ranked by what you already have, and waste less food. Runs entirely in your browser.">
  <meta property="og:site_name" content="PantryPilot">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="PantryPilot — Cook what's about to expire">
  <meta name="twitter:description" content="A private, offline-first pantry tracker and use-it-first recipe finder.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234cbf8a'/%3E%3Cpath d='M16 25c-4 0-7-3-7-7 0-5 4.5-8.5 14-8.5 0 7.5-3.5 15.5-7 15.5z' fill='none' stroke='%23100e09' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M9 26c1.7-5.3 5.2-8 10.5-9' fill='none' stroke='%23100e09' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234cbf8a'/%3E%3Cpath d='M16 25c-4 0-7-3-7-7 0-5 4.5-8.5 14-8.5 0 7.5-3.5 15.5-7 15.5z' fill='none' stroke='%23100e09' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <div class="topbar__inner container">
      <a class="brand" href="#" aria-label="PantryPilot home">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20c-4 0-7-3-7-7 0-5 4.5-8.5 14-8.5 0 7.5-3.5 15.5-7 15.5z"/>
            <path d="M5 21c1.7-5.3 5.2-8 11-9"/>
          </svg>
        </span>
        <span class="brand__text">
          <span class="brand__name">PantryPilot</span>
          <span class="brand__tag">use it first</span>
        </span>
      </a>

      <div class="topbar__actions">
        <button class="icon-btn" id="shopping-btn" aria-label="Open shopping list" title="Shopping list">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h2.2l2.2 12.4a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 2-1.6L22 7H5.2"/></svg>
          <span class="count-badge" id="shopping-count" hidden>0</span>
        </button>
        <div class="menu-wrap">
          <button class="icon-btn" id="data-menu-btn" aria-haspopup="true" aria-expanded="false" aria-label="Backup and data options" title="Backup &amp; data">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
          </button>
          <div class="menu" id="data-menu" role="menu" aria-label="Data options">
            <button class="menu__item" id="menu-export" role="menuitem">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4m4-5 5 5 5-5m-5 5V3"/></svg>
              <span>Export data</span>
            </button>
            <button class="menu__item" id="menu-import" role="menuitem">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4m4-7 5-5 5 5m-5-5v12"/></svg>
              <span>Import data</span>
            </button>
            <div class="menu__divider" role="separator"></div>
            <button class="menu__item menu__item--danger" id="menu-reset" role="menuitem">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8m0-5v5h5"/></svg>
              <span>Reset to sample</span>
            </button>
          </div>
        </div>
        <input type="file" id="import-input" accept="application/json,.json" hidden>
      </div>
    </div>

    <nav class="nav container" aria-label="Primary">
      <div class="nav__rail" role="tablist" aria-label="Sections">
        <button class="nav__tab is-active" data-tab="pantry" role="tab" aria-selected="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M10 6h.01M10 12h.01M10 18h.01"/></svg>
          <span>Pantry</span>
        </button>
        <button class="nav__tab" data-tab="recipes" role="tab" aria-selected="false" tabindex="-1">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>
          <span>Recipes</span>
        </button>
        <button class="nav__tab" data-tab="stats" role="tab" aria-selected="false" tabindex="-1">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 14 4-4 3 3 5-6"/></svg>
          <span>Stats</span>
        </button>
      </div>
    </nav>
  </header>

  <main class="container" id="main">
    <section class="view is-active" id="view-pantry" role="tabpanel" aria-label="Pantry"></section>
    <section class="view" id="view-recipes" role="tabpanel" aria-label="Recipes"></section>
    <section class="view" id="view-stats" role="tabpanel" aria-label="Statistics"></section>
  </main>

  <footer class="site-foot container">
    <span>PantryPilot · everything stays on this device</span>
    <span class="site-foot__dot" aria-hidden="true">·</span>
    <span>© 2026 Indraneel Mandal</span>
  </footer>

  <div class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer__backdrop" data-close-drawer></div>
    <aside class="drawer__panel" role="dialog" aria-modal="true" aria-label="Shopping list">
      <div class="drawer__head">
        <h2 class="drawer__title">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h2.2l2.2 12.4a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 2-1.6L22 7H5.2"/></svg>
          Shopping list
        </h2>
        <button class="icon-btn" id="drawer-close" data-close-drawer aria-label="Close shopping list">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="drawer__content" id="drawer-content"></div>
    </aside>
  </div>

  <div class="modal" id="modal" aria-hidden="true"></div>
  <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

  <script src="script.js" defer></script>
</body>
</html>
